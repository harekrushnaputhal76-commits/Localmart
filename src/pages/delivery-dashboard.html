<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Partner Portal - Local Mart</title>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body>
  <header>
    <h1>Delivery Partner Portal</h1>
    <div>
      <label for="status-toggle">Status: Online</label>
      <input type="checkbox" id="status-toggle" checked>
    </div>
  </header>

  <main>
    <section>
      <h2>New Deliveries Assigned</h2>
      <ul>
        <li>
          <p>Pickup Location: Warehouse / Seller Address</p>
          <p>Drop Location: Buyer Delivery Address</p>
          <button type="button">Mark as Delivered</button>
        </li>
      </ul>
    </section>

    <section>
      <h2>Completed Deliveries</h2>
      <ul></ul>
    </section>
  </main>

  <footer>
    <nav>
      <a href="#tasks">Tasks</a>
      <a href="#history">History</a>
      <a href="#profile">Profile</a>
    </nav>
  </footer>

  <script src="../../public/js/app.js"></script>
</body>
</html>
