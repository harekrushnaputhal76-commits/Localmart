<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>All Categories - Local Mart</title>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body>
  <div class="app-wrapper">
    <header>
      <a href="home.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </a>
      <h1>All Categories</h1>
      <div style="width: 22px;"></div>
    </header>

    <main class="animate-fade-in" style="padding: 14px; padding-bottom: 95px;">
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
        <div class="category-card" style="background: var(--surface); border-radius: 12px; padding: 18px 12px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer;" onclick="window.location.href='home.html?cat=Electronics';">
          <img src="https://images.unsplash.com/photo-1498049794561-7780e7231661?w=200&q=80" alt="Electronics" style="width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 8px;">
          <div style="font-weight: 700; font-size: 14px; color: var(--text-main);">Electronics</div>
          <span style="font-size: 11px; color: var(--text-muted);">Laptops, Audio & More</span>
        </div>

        <div class="category-card" style="background: var(--surface); border-radius: 12px; padding: 18px 12px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer;" onclick="window.location.href='home.html?cat=Furniture';">
          <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=200&q=80" alt="Furniture" style="width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 8px;">
          <div style="font-weight: 700; font-size: 14px; color: var(--text-main);">Furniture</div>
          <span style="font-size: 11px; color: var(--text-muted);">Chairs, Desks & Sofas</span>
        </div>

        <div class="category-card" style="background: var(--surface); border-radius: 12px; padding: 18px 12px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer;" onclick="window.location.href='home.html?cat=Vehicles';">
          <img src="https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=200&q=80" alt="Vehicles" style="width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 8px;">
          <div style="font-weight: 700; font-size: 14px; color: var(--text-main);">Vehicles</div>
          <span style="font-size: 11px; color: var(--text-muted);">Bicycles & Scooters</span>
        </div>

        <div class="category-card" style="background: var(--surface); border-radius: 12px; padding: 18px 12px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer;" onclick="window.location.href='home.html?cat=Fashion';">
          <img src="https://images.unsplash.com/photo-1445205170230-053b83016050?w=200&q=80" alt="Fashion" style="width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 8px;">
          <div style="font-weight: 700; font-size: 14px; color: var(--text-main);">Fashion</div>
          <span style="font-size: 11px; color: var(--text-muted);">Jackets, Shoes & Bags</span>
        </div>

        <div class="category-card" style="background: var(--surface); border-radius: 12px; padding: 18px 12px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer;" onclick="window.location.href='home.html?cat=Mobiles';">
          <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02560?w=200&q=80" alt="Mobiles" style="width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 8px;">
          <div style="font-weight: 700; font-size: 14px; color: var(--text-main);">Mobiles</div>
          <span style="font-size: 11px; color: var(--text-muted);">iPhones, Android & Tabs</span>
        </div>

        <div class="category-card" style="background: var(--surface); border-radius: 12px; padding: 18px 12px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer;" onclick="window.location.href='home.html?cat=Services';">
          <img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=200&q=80" alt="Services" style="width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 8px;">
          <div style="font-weight: 700; font-size: 14px; color: var(--text-main);">Services</div>
          <span style="font-size: 11px; color: var(--text-muted);">Repairs & Local Help</span>
        </div>
      </div>
    </main>

    <footer>
      <nav>
        <a href="home.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Home</span>
        </a>
        <a href="categories.html" class="active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Categories</span>
        </a>
        <a href="sell.html" class="nav-fab">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </a>
        <a href="profile.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Profile</span>
        </a>
      </nav>
    </footer>
  </div>

  <script src="../../public/js/app.js"></script>
</body>
</html>
