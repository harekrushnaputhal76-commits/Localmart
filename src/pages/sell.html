<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell an Item - Local Mart</title>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body>
  <header>
    <a href="home.html">Back to Home</a>
    <h1>Sell an Item</h1>
  </header>

  <main>
    <form>
      <div>
        <label for="product-image">Product Image</label>
        <input type="file" id="product-image" accept="image/*">
      </div>

      <div>
        <label for="product-title">Product Title</label>
        <input type="text" id="product-title" placeholder="Enter product title">
      </div>

      <div>
        <label for="product-description">Description</label>
        <textarea id="product-description" rows="4" placeholder="Enter description"></textarea>
      </div>

      <div>
        <label for="product-price">Seller's Price</label>
        <input type="number" id="product-price" placeholder="Enter price" min="0">
      </div>

      <div>
        <label for="product-category">Category</label>
        <select id="product-category">
          <option value="electronics">Electronics</option>
          <option value="furniture">Furniture</option>
          <option value="vehicles">Vehicles</option>
          <option value="others">Others</option>
        </select>
      </div>

      <button type="submit">Post Item</button>
    </form>
  </main>

    <footer>
    <nav>
      <a href="home.html">

        <span>Home</span>
      </a>
      <a href="categories.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Categories</span>
      </a>
      <a href="sell.html" class="nav-fab">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </a>
      <a href="profile.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile</span>
      </a>
    </nav>
  </footer>

  <script src="../../public/js/app.js"></script>
</body>
</html>
