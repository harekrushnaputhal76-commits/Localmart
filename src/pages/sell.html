<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sell an Item - Local Mart</title>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body>
  <div class="app-wrapper">
    <header>
      <a href="home.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </a>
      <h1>Post an Item for Sale</h1>
      <div style="width: 22px;"></div>
    </header>

    <main class="animate-fade-in" style="padding: 14px; padding-bottom: 95px;">
      <div class="card" style="margin: 0;">
        <form>
          <div class="form-group">
            <label for="product-image">Product Photo</label>
            <input type="file" id="product-image" accept="image/*">
            <small style="color: var(--text-muted); font-size: 11px;">Upload a clear photo to sell 3x faster</small>
          </div>

          <div class="form-group">
            <label for="product-title">Item Title</label>
            <input type="text" id="product-title" placeholder="e.g., iPhone 13, Study Table, Mountain Bike" required>
          </div>

          <div class="form-group">
            <label for="product-category">Category</label>
            <select id="product-category" required>
              <option value="mobiles">Mobiles</option>
              <option value="electronics">Electronics</option>
              <option value="furniture">Furniture</option>
              <option value="vehicles">Vehicles</option>
              <option value="fashion">Fashion</option>
              <option value="others">Others</option>
            </select>
          </div>

          <div class="form-group">
            <label for="product-price">Your Price (₹)</label>
            <input type="number" id="product-price" placeholder="e.g., 2500" min="1" required>
          </div>

          <div class="form-group">
            <label for="product-description">Description</label>
            <textarea id="product-description" rows="3" placeholder="Condition, age of item, reasons for selling, inclusions..."></textarea>
          </div>

          <div style="background: var(--primary-light); padding: 10px; border-radius: 8px; font-size: 11.5px; color: var(--primary); margin-bottom: 14px;">
            🔒 <strong>Neighborhood Protection:</strong> Local delivery partner will pick up from your doorstep once an order is placed. No phone number sharing required.
          </div>

          <button type="submit" class="btn-buy" style="padding: 13px; font-size: 14px;">
            Post Item to Local Mart
          </button>
        </form>
      </div>
    </main>

    <footer>
      <nav>
        <a href="home.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Home</span>
        </a>
        <a href="categories.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Categories</span>
        </a>
        <a href="sell.html" class="nav-fab active">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </a>
        <a href="profile.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Profile</span>
        </a>
      </nav>
    </footer>
  </div>

  <script src="../../public/js/app.js"></script>
</body>
</html>
