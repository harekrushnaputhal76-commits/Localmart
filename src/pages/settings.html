<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Local Mart</title>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body>
  <header>
    <a href="profile.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <h1>Settings</h1>
    <div style="width: 22px;"></div>
  </header>

  <main class="animate-fade-in" style="padding-top: 68px; padding-bottom: 95px;">
    <!-- App Preferences -->
    <div class="settings-section">
      <div class="settings-section-title">Preferences</div>
      <div class="settings-item">
        <span class="icon-label">🌙 Dark Mode</span>
        <input type="checkbox" id="dark-toggle">
      </div>
      <div class="settings-item">
        <span class="icon-label">🔔 Push Notifications</span>
        <input type="checkbox" id="notifications-toggle" checked>
      </div>
      <div class="settings-item">
        <span class="icon-label">📍 Hyper-local GPS Radius</span>
        <span>5 km</span>
      </div>
    </div>

    <!-- Account & Orders -->
    <div class="settings-section">
      <div class="settings-section-title">Account & Delivery</div>
      <a href="checkout.html" class="settings-item">
        <span class="icon-label">🏠 Saved Delivery Addresses</span>
        <span class="arrow">›</span>
      </a>
      <a href="profile.html" class="settings-item">
        <span class="icon-label">📦 My Orders & Tracking</span>
        <span class="arrow">›</span>
      </a>
    </div>

    <!-- Support & Legal -->
    <div class="settings-section">
      <div class="settings-section-title">Support & About</div>
      <div class="settings-item">
        <span class="icon-label">ℹ️ App Version</span>
        <span style="color: #64748b; font-size: 12px;">v1.0.0 (Capacitor)</span>
      </div>
      <div class="settings-item">
        <span class="icon-label">🛡️ Privacy Policy</span>
        <span class="arrow">›</span>
      </div>
      <div class="settings-item">
        <span class="icon-label">📄 Terms of Service</span>
        <span class="arrow">›</span>
      </div>
    </div>

    <button type="button" class="btn-buy" style="background: #ef4444; margin-top: 10px;">
      Log Out
    </button>
  </main>

  <footer>
    <nav>
      <a href="home.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Home</span>
      </a>
      <a href="categories.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Categories</span>
      </a>
      <a href="sell.html" class="nav-fab">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </a>
      <a href="profile.html" class="active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile</span>
      </a>
    </nav>
  </footer>

  <script src="../../public/js/app.js"></script>
</body>
</html>
