<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Local Mart</title>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body>
  <header>
    <h1>My Profile</h1>
    <a href="settings.html" style="background: transparent; padding: 4px; box-shadow: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </a>
  </header>

  <main class="animate-fade-in" style="padding-top: 68px; padding-bottom: 95px;">
    <!-- Profile Card -->
    <div class="card" style="display: flex; flex-direction: row; align-items: center; gap: 16px; padding: 18px;">
      <div style="width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #10b981, #059669); color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; flex-shrink: 0;">
        U
      </div>
      <div style="flex: 1;">
        <h2 style="margin: 0; font-size: 17px;">User Name</h2>
        <p style="margin: 2px 0 0 0; font-size: 13px; color: var(--text-muted);">contact@example.com</p>
        <span style="display: inline-block; margin-top: 6px; font-size: 11px; background: #e6fcf5; color: #059669; padding: 2px 8px; border-radius: 4px; font-weight: 600;">Verified Member</span>
      </div>
    </div>

    <!-- Quick Navigation Links -->
    <div class="settings-section">
      <a href="settings.html" class="settings-item">
        <span class="icon-label">⚙️ App Settings</span>
        <span class="arrow">›</span>
      </a>
      <a href="notifications.html" class="settings-item">
        <span class="icon-label">🔔 Notifications</span>
        <span class="arrow">›</span>
      </a>
      <a href="delivery-dashboard.html" class="settings-item">
        <span class="icon-label">🛵 Delivery Partner Portal</span>
        <span class="arrow">›</span>
      </a>
    </div>

    <section>
      <h2>My Active Listings</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin: 0;">You have no active listings.</p>
    </section>

    <section>
      <h2>My Orders</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin: 0;">No past orders found.</p>
    </section>

    <button type="button" class="btn-buy" style="background: #ef4444; margin-top: 10px;">
      Log Out
    </button>
  </main>

  <footer>
    <nav>
      <a href="home.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Home</span>
      </a>
      <a href="categories.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Categories</span>
      </a>
      <a href="sell.html" class="nav-fab">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </a>
      <a href="profile.html" class="active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile</span>
      </a>
    </nav>
  </footer>

  <script src="../../public/js/app.js"></script>
</body>
</html>
