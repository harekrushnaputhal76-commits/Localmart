<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Local Mart</title>
  <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body>
  <div class="app-wrapper" style="justify-content: center; align-items: center; padding: 24px; background: radial-gradient(circle at 50% 30%, #e0e7ff 0%, #f1f3f6 70%);">
    <div style="background: var(--surface); border-radius: 20px; padding: 32px 24px; width: 100%; max-width: 360px; box-shadow: var(--shadow-lg); text-align: center; border: 1px solid var(--border);">
      <div style="width: 64px; height: 64px; border-radius: 18px; background: #2874f0; color: white; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; box-shadow: 0 4px 14px rgba(40, 116, 240, 0.4);">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
      </div>

      <h1 style="font-size: 22px; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">Local Mart</h1>
      <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 24px;">
        Buy & sell in your neighborhood with doorstep verification & delivery.
      </p>

      <button type="button" style="width: 100%; padding: 12px 16px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-main); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: var(--shadow-sm);" onclick="localStorage.setItem('localmart_auth', 'true'); window.location.href='home.html';">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.15z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.15C3.26 21.4 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.24C.45 8.16 0 9.94 0 12s.45 3.84 1.24 5.42l4.04-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.6 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <p style="font-size: 11px; color: var(--text-muted); margin-top: 18px; line-height: 1.4;">
        By continuing, you agree to Local Mart's Terms of Service and Neighborhood Privacy Policy.
      </p>
    </div>
  </div>

  <script src="../../public/js/app.js"></script>
</body>
</html>
